<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<title>Planning Map</title>
		<link rel="stylesheet" href="../vendor/leaflet/leaflet.css"/>
		<script src="../vendor/leaflet/leaflet.js"></script>
		<link rel="stylesheet" href="../styles.css" type="text/css"/>
		<style>
			#map div, #map a { color: black; }
		</style>
	</head>
	<body>
		<div class="title">Destinations</div><br/>
		<input type="button" value="Show route" onclick="toggleRoute();" id="routeToggleButton"/>
		<input type="button" value="Trace route (experimental)" onclick="traceRoute();"/>
		<input type="button" value="Reset map" onclick="resetMap();"/>
		<br/>
		<div id="map" style="width: 780px; max-width: 100%; height: 500px"></div>
		<br/>
		<table cellpadding="0" cellspacing="2" border="0">
			<tr><td><div style="text-align: center; font-weight: bold;">Itinerary (tentative)</div></td></tr>
			<tr><td><div id="itinerary"></div></td></tr>
		</table>
		<span id="map_description"></span>
		<script src="map.js"></script>
		<script>setupMap('mapdata-planning.xml');</script>
	</body>
</html>
